name: Bazar MVP quality (isolated)
on:
  push:
    branches:
      - feat/bazar-mvp-demo-20261107

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bazar without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test scripts/test-bazar.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test mobile experience (local server only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npm run start -- --port 3100 > /tmp/bazar-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/bazar > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/test-bazar-browser.mjs
      - name: Preserve mobile screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazar-mobile-review
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
