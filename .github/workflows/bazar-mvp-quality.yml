name: Bazar MVP quality (isolated)
on:
  push:
    branches:
      - feat/bazar-mvp-demo-20261107

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bazar without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test scripts/test-bazar.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
